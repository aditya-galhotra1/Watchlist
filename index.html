<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Watchlist">
<meta name="theme-color" content="#11131c">
<link rel="apple-touch-icon" href="icon.png">
<title>Watchlist</title>
<style>
:root{--bg:#11131c;--card:#1a1d2a;--line:#2b3042;--tx:#eceef5;--mut:#8f95aa;--ac:#8be0c6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 14px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
h1{font-size:30px;margin:0;font-weight:700}
#st{font-size:13px;color:var(--mut);margin-right:8px}
.hbtn{width:38px;height:38px;padding:0;border-radius:50%;font-size:18px}
#tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
#tabs button.on,.seg button.on,.pri{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--pw,104px),1fr));gap:12px}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.poster{position:relative;aspect-ratio:2/3;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--mut)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:6px;left:6px;background:#000b;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px}
.tag.fin{left:auto;right:6px;background:var(--ac);color:var(--on);font-weight:600}
#tabs button{flex:none;white-space:nowrap}
.bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:#0008}
.bar i{display:block;height:100%;background:var(--ac)}
.meta{padding:8px 8px 10px}
.meta b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mut);font-size:12px;margin-top:2px}
.step{margin-top:6px;text-align:center}
.step div{display:flex;gap:6px;margin-top:4px}
.step button{flex:1;height:30px;padding:0;font-size:18px;line-height:1;border-radius:8px}
.step span{font-weight:600;font-size:13px}
#ctl{display:flex;gap:8px;margin:0 0 16px}
#ctl select{flex:1;min-width:0;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
#ctl button{white-space:nowrap}
#ctl button.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips button{display:flex;align-items:center;gap:6px;padding:7px 12px}
.chips button.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.chips .sw{width:34px;height:34px;padding:0}
.chips .sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--tx);border-color:transparent}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid #8886;display:inline-block}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=color]{width:46px;height:34px;border:0;background:none;padding:0}
#empty{color:var(--mut);text-align:center;margin-top:60px}
#fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;padding:0;font-size:32px;border-radius:50%;background:var(--ac);border-color:var(--ac);color:var(--on)}
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:5}
.sheet[hidden]{display:none}
#box{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
#box label{display:block;color:var(--mut);font-size:14px;margin:14px 0 6px}
#box label.chk{display:flex;gap:8px;align-items:center;color:var(--tx);margin:12px 0}
input[type=text],input[type=number],input[type=date]{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
.seg{display:flex;gap:8px}.seg button{flex:1}
.pick{display:flex;align-items:center;gap:12px;margin-top:12px}
.pick img{width:60px;height:90px;object-fit:cover;border-radius:8px}
.pick label{margin:0!important;color:var(--tx)!important;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.eps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eps small{color:var(--mut)}
.stars button{background:none;border:0;font-size:30px;padding:0 6px;color:var(--ac)}
.row{display:flex;gap:10px;margin-top:20px}.row button{flex:1}
.del{color:#ff8a8a}
</style>
</head>
<body>
<header><h1>Watchlist</h1><span><span id="st"></span><button class="hbtn" onclick="openTheme()" aria-label="Theme">🎨</button></span></header>
<div id="tabs"></div>
<div id="ctl">
<select id="sort" onchange="prefs.sort=this.value;savePrefs();render()">
<option value="upd">Recently updated</option>
<option value="prog">In progress first, finished last</option>
<option value="rate">Rating: high to low</option>
<option value="rateLow">Rating: low to high</option>
<option value="dateNew">Date finished: newest</option>
<option value="dateOld">Date finished: oldest</option>
<option value="az">Title: A to Z</option>
<option value="za">Title: Z to A</option>
<option value="added">Recently added</option>
</select>
<button id="hide" onclick="toggleHide()">Hide finished</button>
</div>
<div id="grid"></div>
<p id="empty" hidden>Nothing here yet. Tap + to add something.</p>
<button id="fab" aria-label="Add" onclick="openForm()">+</button>
<div class="sheet" id="m" hidden><div id="box"></div></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyP1YV3j5EUIaV03P59_0ImGwSmGruPFhd4pCMfGMfzlCjI536CEFc14y88YEKiMu_g_w/exec';
const live = API.startsWith('https');

const $ = s => document.querySelector(s);
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total = i => i.seasons.reduce((a, b) => a + b, 0);

let items = JSON.parse(localStorage.wl || '[]'), tab = 'all', f = null, isNew = false, timers = {};
const persist = () => localStorage.wl = JSON.stringify(items);

const THEMES = {
  midnight: ['Midnight', '#11131c', '#1a1d2a', '#2b3042', '#eceef5', '#8f95aa'],
  black:    ['Black',    '#000000', '#141414', '#2a2a2a', '#f5f5f5', '#8a8a8a'],
  light:    ['Light',    '#f4f5f8', '#ffffff', '#dfe2ea', '#1a1d2a', '#6b7186'],
  ocean:    ['Ocean',    '#0c1a24', '#12293a', '#1f3d54', '#e6f1f8', '#86a3b8'],
  forest:   ['Forest',   '#101a14', '#17261d', '#25402f', '#e8f3ec', '#8aa595'],
  plum:     ['Plum',     '#1a1020', '#261830', '#3d2850', '#f3e9f8', '#a58cb5']
};
const ACCENTS = ['#8be0c6', '#ff7a6b', '#6cb8ff', '#ffc94d', '#b69cff', '#ff7eb6'];
let prefs = Object.assign({ theme: 'midnight', ac: '#8be0c6', pw: 104, sort: 'upd', hide: false }, JSON.parse(localStorage.wlp || '{}'));
const savePrefs = () => localStorage.wlp = JSON.stringify(prefs);

function onColor(h) {
  const n = parseInt(h.slice(1), 16);
  return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 150 ? '#0b1a15' : '#ffffff';
}
function applyPrefs() {
  const t = THEMES[prefs.theme] || THEMES.midnight, r = document.documentElement.style;
  ['--bg', '--card', '--line', '--tx', '--mut'].forEach((k, n) => r.setProperty(k, t[n + 1]));
  r.setProperty('--ac', prefs.ac);
  r.setProperty('--on', onColor(prefs.ac));
  r.setProperty('--pw', prefs.pw + 'px');
  document.querySelector('meta[name=theme-color]').content = t[1];
}
function setTheme(k) { prefs.theme = k; savePrefs(); applyPrefs(); drawTheme(); }
function setAc(c) { prefs.ac = c; savePrefs(); applyPrefs(); drawTheme(); }
function resetTheme() { prefs.theme = 'midnight'; prefs.ac = '#8be0c6'; prefs.pw = 104; savePrefs(); applyPrefs(); drawTheme(); }
function openTheme() { drawTheme(); $('#m').hidden = false; }
function drawTheme() {
  $('#box').innerHTML = `
  <label>Theme</label>
  <div class="chips">${Object.entries(THEMES).map(([k, t]) => `<button class="${prefs.theme == k ? 'on' : ''}" onclick="setTheme('${k}')"><span class="dot" style="background:${t[1]}"></span>${t[0]}</button>`).join('')}</div>
  <label>Accent colour</label>
  <div class="chips">${ACCENTS.map(c => `<button class="sw ${prefs.ac == c ? 'on' : ''}" style="background:${c}" onclick="setAc('${c}')"></button>`).join('')}<input type="color" value="${prefs.ac}" oninput="prefs.ac=this.value;savePrefs();applyPrefs()"></div>
  <label>Poster size</label>
  <input type="range" min="80" max="180" value="${prefs.pw}" oninput="prefs.pw=+this.value;savePrefs();applyPrefs()">
  <div class="row"><button onclick="resetTheme()">Reset</button><button class="pri" onclick="closeM()">Done</button></div>`;
}

const fin = i => i.kind == 'series' && !i.ongoing && i.w >= total(i);
function dateNewest(a, b) {
  const x = a.date, y = b.date;
  if (!x && !y) return b.t - a.t;
  if (!x) return -1;
  if (!y) return 1;
  return x > y ? -1 : x < y ? 1 : b.t - a.t;
}
function dateOldest(a, b) {
  const x = a.date, y = b.date;
  if (!x && !y) return b.t - a.t;
  if (!x) return -1;
  if (!y) return 1;
  return x < y ? -1 : x > y ? 1 : b.t - a.t;
}
function cmp(a, b) {
  const s = prefs.sort;
  if (s == 'prog') {
    const d = (fin(a) || a.kind == 'movie') - (fin(b) || b.kind == 'movie');
    return d || b.t - a.t;
  }
  if (s == 'rate' || s == 'rateLow') {
    const ra = +a.rating || 0, rb = +b.rating || 0;
    if (ra && rb && ra != rb) return s == 'rate' ? rb - ra : ra - rb;
    if (!ra != !rb) return ra ? -1 : 1;
    return dateNewest(a, b);
  }
  if (s == 'dateNew') return dateNewest(a, b);
  if (s == 'dateOld') return dateOldest(a, b);
  if (s == 'az') return a.title.localeCompare(b.title);
  if (s == 'za') return b.title.localeCompare(a.title);
  if (s == 'added') return parseInt(b.id, 36) - parseInt(a.id, 36);
  return b.t - a.t;
}
function toggleHide() { prefs.hide = !prefs.hide; savePrefs(); render(); }

function pos(i) {
  let w = i.w, s = 0;
  if (!w) return 'Not started';
  while (s < i.seasons.length - 1 && w > i.seasons[s]) { w -= i.seasons[s]; s++; }
  return 'S' + (s + 1) + ' · E' + w;
}

function render() {
  const list = items.filter(i => tab == 'all' || (tab == 'movie' && i.kind == 'movie' && !i.anime) || (tab == 'series' && i.kind == 'series' && !i.anime) || (tab == 'am' && i.kind == 'movie' && i.anime) || (tab == 'as' && i.kind == 'series' && i.anime)).filter(i => !(prefs.hide && fin(i))).sort(cmp);
  $('#tabs').innerHTML = [['all','All'],['movie','Movies'],['series','Series'],['am','Anime Movies'],['as','Anime Shows']].map(([k, l]) => `<button class="${tab == k ? 'on' : ''}" onclick="tab='${k}';render()">${l}</button>`).join('');
  $('#grid').innerHTML = list.map(card).join('');
  $('#empty').hidden = list.length > 0;
  $('#sort').value = prefs.sort;
  $('#hide').className = prefs.hide ? 'on' : '';
}

function card(i) {
  const s = i.kind == 'series', done = s && !i.ongoing && i.w >= total(i);
  const rd = (i.rating ? '★ ' + (+i.rating) + '<br>' : '') + (i.date || '');
  const body = s
    ? `<div class="step"><span>${pos(i)}</span><div><button onclick="step('${i.id}',-1)">−</button><button onclick="step('${i.id}',1)">+</button></div></div>${done && rd ? `<div class="sub">${rd}</div>` : ''}`
    : `<div class="sub">${rd}</div>`;
  return `<div class="card"><div class="poster" onclick="openForm('${i.id}')">${i.img ? `<img src="${i.img}">` : esc(i.title[0] || '?')}${i.anime ? '<span class="tag">Anime</span>' : ''}${done ? '<span class="tag fin">Finished</span>' : ''}${s ? `<div class="bar"><i style="width:${Math.min(100, i.w / total(i) * 100)}%"></i></div>` : ''}</div><div class="meta"><b>${esc(i.title)}</b>${body}</div></div>`;
}

function step(id, d) {
  const i = items.find(x => x.id == id), t = total(i);
  if (d > 0) {
    if (i.w >= t) { if (!i.ongoing) return; i.seasons[i.seasons.length - 1]++; }
    i.w++;
  } else i.w = Math.max(0, i.w - 1);
  if (!i.ongoing) i.date = i.w >= total(i) ? (i.date || today()) : '';
  save(i);
}

function save(i) {
  i.t = Date.now();
  const k = items.findIndex(x => x.id == i.id);
  k < 0 ? items.push(i) : items[k] = i;
  persist(); render();
  sync(i.id, { action: 'save', item: i });
}

function sync(id, body) {
  if (!live) return;
  clearTimeout(timers[id]);
  $('#st').textContent = 'Saving…';
  timers[id] = setTimeout(async () => {
    try {
      await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) });
      $('#st').textContent = 'Synced';
    } catch (e) { $('#st').textContent = 'Offline'; }
  }, 700);
}

async function load() {
  render();
  if (!live) return;
  try {
    const d = await (await fetch(API)).json();
    if (d.items) { items = d.items; persist(); render(); $('#st').textContent = 'Synced'; }
  } catch (e) { $('#st').textContent = 'Offline'; }
}

function openForm(id) {
  const it = items.find(x => x.id == id);
  isNew = !it;
  f = it ? JSON.parse(JSON.stringify(it)) : { id: Date.now().toString(36), kind: 'movie', anime: false, title: '', img: '', rating: 0, date: today(), seasons: [12], ongoing: false, w: 0 };
  draw();
  $('#m').hidden = false;
}
const closeM = () => $('#m').hidden = true;

function setK(k) {
  f.kind = k;
  if (k == 'series' && !f.seasons.length) f.seasons = [12];
  if (isNew) f.date = k == 'movie' ? today() : '';
  draw();
}
function setN(n) {
  n = Math.max(1, Math.min(40, n || 1));
  while (f.seasons.length < n) f.seasons.push(f.seasons[f.seasons.length - 1] || 12);
  f.seasons.length = n;
  draw();
}
function pic(file) {
  if (!file) return;
  const im = new Image();
  im.onload = () => {
    let w = 320, q = .85, d;
    do {
      const c = document.createElement('canvas');
      c.width = w; c.height = Math.round(im.height * w / im.width);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      d = c.toDataURL('image/jpeg', q);
      if (q > .5) q -= .1; else w -= 40;
    } while (d.length > 45000 && w > 120);
    f.img = d; draw();
  };
  im.src = URL.createObjectURL(file);
}

function draw() {
  const s = f.kind == 'series';
  $('#box').innerHTML = `
  <div class="seg"><button class="${!s ? 'on' : ''}" onclick="setK('movie')">Movie</button><button class="${s ? 'on' : ''}" onclick="setK('series')">Series</button></div>
  <label class="chk"><input type="checkbox" ${f.anime ? 'checked' : ''} onchange="f.anime=this.checked"> Anime</label>
  <input type="text" placeholder="Title" value="${esc(f.title)}" oninput="f.title=this.value">
  <div class="pick">${f.img ? `<img src="${f.img}">` : ''}<label>${f.img ? 'Change poster' : 'Add poster'}<input type="file" accept="image/*" hidden onchange="pic(this.files[0])"></label></div>
  ${s ? `<label>How many seasons?</label><input type="number" min="1" max="40" value="${f.seasons.length}" onchange="setN(+this.value)">
  <label>Episodes in each season</label><div class="eps">${f.seasons.map((n, k) => `<div><small>Season ${k + 1}</small><input type="number" min="1" value="${n}" oninput="f.seasons[${k}]=Math.max(1,+this.value||1)"></div>`).join('')}</div>
  <label class="chk"><input type="checkbox" ${f.ongoing ? 'checked' : ''} onchange="f.ongoing=this.checked"> Still airing (enter the episodes out so far)</label>
  <label class="chk"><input type="checkbox" ${f.all ? 'checked' : ''} onchange="f.all=this.checked"> I've already watched all of it (jump to the last episode)</label>
  <label>Date finished</label>` : '<label>Date watched</label>'}
  <input type="date" value="${f.date}" onchange="f.date=this.value">
  <label>Rating out of 10 (optional)</label>
  <input type="number" inputmode="decimal" min="0" max="10" step="0.01" placeholder="e.g. 8.07" value="${f.rating || ''}" oninput="const v=parseFloat(this.value);f.rating=isNaN(v)?0:Math.min(10,Math.max(0,Math.round(v*100)/100))">
  <div class="row"><button class="pri" onclick="commit()">Save</button>${isNew ? '' : '<button class="del" onclick="del()">Delete</button>'}<button onclick="closeM()">Cancel</button></div>`;
}

function commit() {
  f.title = f.title.trim();
  if (!f.title) return alert('Add a title first');
  if (f.kind == 'series') {
    f.w = f.all ? total(f) : Math.min(f.w, total(f));
    if (!f.ongoing && f.w >= total(f) && !f.date) f.date = today();
  } else { f.seasons = []; f.w = 0; }
  delete f.all;
  save(f); closeM();
}
function del() {
  if (!confirm('Delete "' + f.title + '"?')) return;
  items = items.filter(x => x.id != f.id);
  persist(); render(); sync(f.id, { action: 'delete', id: f.id }); closeM();
}

applyPrefs();
load();
</script>
</body>
</html>
